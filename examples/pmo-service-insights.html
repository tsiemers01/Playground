<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PMO Service Insight Assessment – Interaktive Präsentation</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #16202e;
  --text: #e7ecf3;
  --muted: #8b9cb3;
  --accent: #60a5fa;
  --accent2: #4ade80;
  --warn: #fbbf24;
  --low: #f87171;
  --grid: #2d3a4f;
  --c0:#1e293b; --c1:#3b82f6; --c2:#22d3ee; --c3:#a78bfa; --c4:#f472b6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
}
.slide {
  display: none;
  height: 100vh;
  overflow-y: auto;
  padding: 3rem 4rem 5rem;
  animation: fadeIn .3s ease;
}
.slide.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
h1 { font-size: 2.1rem; font-weight: 650; margin-bottom: .4rem; }
h2 { font-size: 1.7rem; font-weight: 600; margin-bottom: 1rem; }
h3 { font-size: 1.05rem; font-weight: 600; color: var(--accent); margin: 1.2rem 0 .5rem; }
.subtitle { color: var(--muted); font-size: .95rem; margin-bottom: 1.4rem; }
p { line-height: 1.6; margin-bottom: .8rem; max-width: 1100px; }
ul { margin: 0 0 .8rem 1.3rem; line-height: 1.6; }
li { margin-bottom: .35rem; }
.card {
  background: var(--panel);
  border-radius: 12px;
  padding: 1.4rem 1.6rem;
  margin-bottom: 1.2rem;
  box-shadow: 0 8px 32px rgba(0,0,0,.35);
}
.card h3 { margin-top: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
@media (max-width: 900px) { .grid2,.grid3,.grid4 { grid-template-columns: 1fr; } .slide { padding: 1.5rem; } }
.pill {
  display: inline-block; padding: .15rem .6rem; border-radius: 999px;
  font-size: .75rem; font-weight: 600; margin-right: .35rem;
}
.pill.strategic { background: rgba(96,165,250,.18); color: var(--accent); }
.pill.tactical { background: rgba(167,139,250,.18); color: #a78bfa; }
.pill.operational { background: rgba(74,222,128,.16); color: var(--accent2); }
.pill.gray { background: rgba(139,156,179,.15); color: var(--muted); }
.kpi { font-size: 2rem; font-weight: 700; color: var(--accent); }
.kpi-label { font-size: .8rem; color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: .82rem; }
th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
.scrollbox { max-height: 55vh; overflow-y: auto; border-radius: 8px; }
.heatmap-wrap { overflow-x: auto; }
.heatmap { border-collapse: separate; border-spacing: 1px; font-size: .68rem; }
.heatmap th { position: sticky; top: 0; background: var(--panel); z-index: 2; padding: .3rem .4rem; font-size: .62rem; white-space: nowrap; }
.heatmap th.rowh { position: sticky; left: 0; background: var(--panel); z-index: 3; text-align: right; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heatmap td { width: 26px; height: 22px; text-align: center; border-radius: 3px; cursor: default; color: transparent; }
.heatmap td:hover { outline: 2px solid #fff; color: #fff; z-index: 5; position: relative; }
.heatmap td.l0 { background: #1e293b; }
.heatmap td.l1 { background: #1d4ed8; }
.heatmap td.l2 { background: #0891b2; }
.heatmap td.l3 { background: #a21caf; }
.heatmap td.l4 { background: #f472b6; color: #1a1a2e; }
.heatmap td.l4:hover { color: #1a1a2e; }
.legend { display: flex; gap: .9rem; align-items: center; font-size: .75rem; color: var(--muted); margin: .6rem 0 1rem; flex-wrap: wrap; }
.swatch { width: 13px; height: 13px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: .25rem; }
.bar-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .28rem; font-size: .8rem; }
.bar-label { width: 250px; text-align: right; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.bar-label:hover { color: var(--accent); }
.bar-track { flex: 1; background: var(--panel2); border-radius: 4px; height: 20px; position: relative; }
.bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2563eb, var(--accent)); min-width: 2px; transition: width .3s; }
.bar-val { width: 90px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .75rem; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl { font-size: .78rem; color: var(--muted); }
.slider-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 .9rem 1rem; }
@media (max-width: 900px) { .slider-grid { grid-template-columns: 1fr; } }
.slider-item { background: var(--panel2); border-radius: 8px; padding: .45rem .7rem; }
.slider-item .top { display: flex; justify-content: space-between; font-size: .76rem; margin-bottom: .15rem; }
.slider-item .val { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.btn {
  background: var(--accent); color: #0b1220; border: none; border-radius: 8px;
  padding: .5rem 1.1rem; font-weight: 650; cursor: pointer; font-size: .85rem;
}
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--grid); }
#nav {
  position: fixed; bottom: 1.1rem; right: 1.6rem; display: flex; gap: .5rem; z-index: 50;
}
#counter { position: fixed; bottom: 1.35rem; left: 1.6rem; color: var(--muted); font-size: .8rem; z-index: 50; }
#hint { position: fixed; bottom: 1.35rem; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: .72rem; z-index: 50; }
#tooltip {
  position: fixed; pointer-events: none; background: #0b1220; border: 1px solid var(--grid);
  border-radius: 8px; padding: .55rem .7rem; font-size: .76rem; max-width: 340px;
  display: none; z-index: 99; box-shadow: 0 8px 24px rgba(0,0,0,.5); line-height: 1.45;
}
#tooltip b { color: var(--accent); }
.footnote { font-size: .72rem; color: var(--muted); margin-top: 1rem; }
.tag { font-size: .68rem; color: var(--muted); }
</style>
</head>

      </div>
    </div>

    <h2>Schritt 1: Erwartungen sammeln</h2>
    <p class="subtitle">Tab „Collecting Expectations“: bis zu 5 Kundengruppen (A–E) mit je bis zu 5 Kunden. Jede:r Kunde rangiert seine Top-5-Outcomes.</p>

        <ul>
          <li>Jede:r PMO-Kunde wählt <b>5 unterschiedliche Outcomes</b> und ordnet sie nach Wichtigkeit.</li>
          <li>Bewertungsskala: <b>5 = höchste Priorität</b> … <b>1 = niedrigste Priorität</b>. Nicht gewählte Outcomes bleiben leer.</li>
          <li>Beispieltabelle (Gruppe A, Kunde A1) aus der Datei: Rollen &amp; Verantwortlichkeiten = 5, Projekt-Priorisierung = 5, Kontrolle über Projektteams = 3 …</li>

      <div class="card">
        <h3>Daraus entsteht pro Gruppe eine Outcome-Relevanz</h3>
        <p>Summe der Prioritäten je Outcome ÷ Anzahl Kunden der Gruppe → <b>Outcome Relevance</b> (z.&nbsp;B. 5,49 bei „Bessere Rollen-Definition“, wenn alle 5 Kunden die 5 vergeben). Diese Werte fließen in den nächsten Schritt ein.</p>
      </div>
    </div>

          <button class="btn ghost" id="resetMax">Alle auf 5,49</button>
        </div>
        <div class="slider-grid" id="sliders"></div>
      </div>
      <div class="card scrollbox" style="max-height:62vh;">
        <h3>SOIS-Ranking (live)</h3>
        <div id="liveBars"></div>
      </div>
    </div>
  </section>`);

addSlide(`
  <section class="slide">
    <h2>Ergebnisse richtig einordnen</h2>
    <p class="subtitle">Das Tool liefert datenbasierte Hinweise – keine automatische Entscheidung.</p>
    <div class="card">
      <ul>
        <li>Services mit hohem SOIS-Anteil sind <b>potenziell prioritär</b> – aber die endgültige Portfolio-Entscheidung ist komplex.</li>
        <li>Zu bedenken: Organisationskultur und Reifegrad, Implementierungsdauer und -aufwand, Ressourcenverfügbarkeit, Implementierungsrisiken, Passung zu Strategie und Geschäftsmodell.</li>
        <li>Die Ergebnisse sind Community-Insights, die die tatsächlichen Bedürfnisse Ihrer PMO-Kunden adressieren können – sie ersetzen nicht Ihre maßgeschneiderten Lösungen.</li>
      </ul>
    </div>
    <div class="card">
      <h3>Rechtliches (aus der Originaldatei)</h3>
      <p class="footnote">Alle Rechte am Assessment und seinen Inhalten liegen exklusiv beim Project Management Institute (PMI). Unerlaubte Vervielfältigung, Verbreitung oder Veränderung ist untersagt; Nutzung nur mit korrekter Quellenangabe. Ergebnisse basieren auf Community-Modellen und stellen keine Beratungsleistung dar. PMI behält sich Änderungen vor.</p>
      <p class="footnote">Community: community.pmoga.world · Framework: PMI PMO Practice Guide (PMO Value Ring Framework, Value Generating PMO Flywheel Steps 2 &amp; 3) · Tool-Version 1.03, 3. Nov 2024</p>
    </div>
  </section>`);

slidesEl.innerHTML = slideDefs.map((h, i) => h.replace('<section class="slide', `<section data-i="${i}" class="slide`).replace('class="slide active"', 'class="slide active"')).join('');

function show(i) {
  idx = Math.max(0, Math.min(slideDefs.length - 1, i));
  document.querySelectorAll('.slide').forEach((s, n) => s.classList.toggle('active', n === idx));
  $('#counter').textContent = `${idx + 1} / ${slideDefs.length}`;
  const active = document.querySelector('.slide.active');
  if (active) active.scrollTop = 0;
  window.scrollTo(0, 0);
}
$('#next').onclick = () => show(idx + 1);
$('#prev').onclick = () => show(idx - 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(idx + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(idx - 1); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(slideDefs.length - 1);
});
document.addEventListener('click', e => {
  if (e.target.closest('#nav') || e.target.closest('button') || e.target.closest('input') || e.target.closest('a')) return;
  if (e.clientX > window.innerWidth * 0.55) show(idx + 1); else show(idx - 1);
});

const tooltip = $('#tooltip');
function bindTip(el, html) {
  el.addEventListener('mouseenter', () => { tooltip.innerHTML = html; tooltip.style.display = 'block'; });
  el.addEventListener('mousemove', e => {
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + tooltip.offsetWidth > window.innerWidth - 8) x = e.clientX - tooltip.offsetWidth - pad;
    if (y + tooltip.offsetHeight > window.innerHeight - 8) y = e.clientY - tooltip.offsetHeight - pad;
    tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
  });
  el.addEventListener('mouseleave', () => tooltip.style.display = 'none');
}

const horizonColor = h => ({ 'short term': '#f87171', 'short to medium term': '#fbbf24', 'medium term': '#4ade80', 'medium to long term': '#60a5fa', 'long term': '#a78bfa' }[h] || '#8b9cb3');

$('#outcomeTable').innerHTML =
  '<tr><th>#</th><th>Outcome</th><th>Beschreibung</th><th>Wahrnehmungs-Horizont</th></tr>' +
  outcomes.map((o, i) => `<tr>
    <td class="tag">${i + 1}</td>
    <td style="font-weight:600;min-width:220px;">${esc(o.name)}</td>
    <td style="color:var(--muted);">${esc(o.desc)}</td>
    <td><span class="pill" style="background:${horizonColor(o.horizon)}22;color:${horizonColor(o.horizon)}">${HORIZON_LABEL[o.horizon] || o.horizon}</span></td>
  </tr>`).join('');

$('#serviceTable').innerHTML =
  '<tr><th>#</th><th>Service</th><th>Kategorie</th><th>Domains</th><th>Beschreibung</th></tr>' +
  services.map((s, i) => `<tr>
    <td class="tag">${i + 1}</td>
    <td style="font-weight:600;min-width:200px;">${esc(s.name)}</td>
    <td>${pillFor(s.cat)}</td>
    <td class="tag" style="white-space:nowrap;">${esc(s.domain)}</td>
    <td style="color:var(--muted);">${esc(s.desc)}</td>
  </tr>`).join('');

(function buildCisesHeat() {
  const shortNames = services.map((s, i) => `${i + 1}. ${s.name.length > 18 ? s.name.slice(0, 17) + '…' : s.name}`);
  let html = '<tr><th class="rowh">Outcome \\ Service</th>' + shortNames.map(n => `<th title="${esc(n)}">${esc(n.split('.')[0])}</th>`).join('') + '</tr>';
  outcomes.forEach((o, oi) => {
    html += `<tr><th class="rowh" title="${esc(o.name)}">${oi + 1}. ${esc(o.name)}</th>` +
      cises[oi].map((v, si) => `<td class="l${v}" data-v="${v}">${v}</td>`).join('') + '</tr>';
  });
  const t = $('#cisesHeat');
  t.innerHTML = html;
  t.querySelectorAll('td').forEach(td => {
    const oi = td.parentElement.rowIndex - 1, si = td.cellIndex - 1;
    bindTip(td, `<b>${esc(services[si].name)}</b> → <b>${esc(outcomes[oi].name)}</b><br>CISES = ${td.dataset.v} (0 = strongly disagree … 4 = strongly agree)`);
  });
})();

function renderSoisBars(container, order, relevance, onClick) {
  const total = order.reduce((a, si) => a + relevance.reduce((s, r, oi) => s + r * cises[oi][si], 0), 0) || 1;
  const max = Math.max(...order.map(si => relevance.reduce((s, r, oi) => s + r * cises[oi][si], 0)), 1);
  container.innerHTML = order.map(si => {
    const abs = relevance.reduce((s, r, oi) => s + r * cises[oi][si], 0);
    const rel = abs / total * 100;
    return `<div class="bar-row" data-si="${si}">
      <div class="bar-label" title="${esc(services[si].name)}">${pillFor(services[si].cat)} ${si + 1}. ${esc(services[si].name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(abs / max * 100).toFixed(2)}%"></div></div>
      <div class="bar-val">${abs.toFixed(1)} · ${rel.toFixed(1)} %</div>
    </div>`;
  }).join('');
  container.querySelectorAll('.bar-row').forEach(row => {
    row.style.cursor = 'pointer';
    row.addEventListener('click', () => onClick && onClick(parseInt(row.dataset.si)));
    bindTip(row.querySelector('.bar-label'), `<b>${esc(services[parseInt(row.dataset.si)].name)}</b><br>${esc(services[parseInt(row.dataset.si)].desc)}<br><span class="tag">${esc(services[parseInt(row.dataset.si)].domain)}</span>`);
  });
}

function showSoisDetail(si) {
  const rel = example.relevance;
  const contribs = outcomes.map((o, oi) => ({ o, oi, c: rel[oi] * cises[oi][si] })).filter(x => x.c > 0.001).sort((a, b) => b.c - a.c).slice(0, 8);
  $('#soisDetail').innerHTML = `<b>Top-Beiträge zu „${esc(services[si].name)}“ (SOIS ${example.sois[si].toFixed(1)}):</b> ` +
    contribs.map(x => `${esc(x.o.name)} (${x.c.toFixed(1)})`).join(' · ');
}

(function initSois() {
  const all = services.map((_, i) => i);
  renderSoisBars($('#soisBars'), all.slice().sort((a, b) => example.sois[b] - example.sois[a]), example.relevance, showSoisDetail);
  $('#sortAbs').onclick = () => renderSoisBars($('#soisBars'), all.slice().sort((a, b) => example.sois[b] - example.sois[a]), example.relevance, showSoisDetail);
  $('#sortCat').onclick = () => {
    const order = { 'Strategisch': 0, 'Taktisch': 1, 'Operativ': 2 };
    renderSoisBars($('#soisBars'), all.slice().sort((a, b) => (order[services[a].cat] - order[services[b].cat]) || (example.sois[b] - example.sois[a])), example.relevance, showSoisDetail);
  };
})();

(function initLive() {
  const rel = example.relevance.slice();
  const sliders = $('#sliders');
  sliders.innerHTML = outcomes.map((o, oi) => `
    <div class="slider-item">
      <div class="top"><span>${oi + 1}. ${esc(o.name)}</span><span class="val" id="val${oi}">${rel[oi].toFixed(2)}</span></div>
      <input type="range" min="0" max="5.5" step="0.01" value="${rel[oi]}" id="sl${oi}">
    </div>`).join('');
  function recalc() {
    for (let oi = 0; oi < 30; oi++) {
      rel[oi] = parseFloat($('#sl' + oi).value);
      $('#val' + oi).textContent = rel[oi].toFixed(2);
    }
    renderSoisBars($('#liveBars'), services.map((_, i) => i).sort((a, b) =>
      rel.reduce((s, r, o) => s + r * cises[o][b], 0) - rel.reduce((s, r, o) => s + r * cises[o][a], 0)
    ), rel, null);
  }
  for (let oi = 0; oi < 30; oi++) $('#sl' + oi).addEventListener('input', recalc);
  $('#loadExample').onclick = () => { for (let oi = 0; oi < 30; oi++) { $('#sl' + oi).value = example.relevance[oi]; } recalc(); };
  $('#resetAll').onclick = () => { for (let oi = 0; oi < 30; oi++) { $('#sl' + oi).value = 0; } recalc(); };
  $('#resetMax').onclick = () => { for (let oi = 0; oi < 30; oi++) { $('#sl' + oi).value = 5.4945; } recalc(); };
  recalc();
})();

show(0);
</script>
</body>
</html>
